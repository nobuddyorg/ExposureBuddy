name: Mutation testing

# Not part of CI, so Deploy Pages never waits for it. Lockfile-only changes (Dependabot) skip it; the weekly full run covers dependencies.
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'web/**'
      - '!web/package.json'
      - '!web/package-lock.json'
      - '.github/workflows/mutation.yml'
      - '.github/actions/**'
  # main runs incrementally too and seeds every pull request's cache.
  push:
    branches: [ main ]
    paths:
      - 'web/**'
      - '!web/package.json'
      - '!web/package-lock.json'
      - '.github/workflows/mutation.yml'
      - '.github/actions/**'
  workflow_dispatch:
  # The full run: incremental mode is blind to dependencies and to modules a target imports.
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Scoped to mutation-targets.mjs, split round-robin across the matrix by MUTATION_SHARD (stryker.config.mjs); each shard enforces the break threshold.
  mutation_test:
    name: mutation_test (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [ 1, 2, 3, 4, 5, 6 ]
    env:
      MUTATION_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-web

      # One incremental file per shard; a PR restores main's latest. Keyed on the test config, which incremental mode cannot see.
      - name: Restore the incremental mutation report
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/reports/stryker-incremental.json
          key: stryker-incremental-${{ matrix.shard }}-of-${{ strategy.job-total }}-${{ hashFiles('web/stryker.config.mjs', 'web/vitest.config.mts', 'web/vitest.mutation.config.mts', 'web/vitest.setup.ts') }}-${{ github.run_id }}
          restore-keys: stryker-incremental-${{ matrix.shard }}-of-${{ strategy.job-total }}-${{ hashFiles('web/stryker.config.mjs', 'web/vitest.config.mts', 'web/vitest.mutation.config.mts', 'web/vitest.setup.ts') }}-

      - name: Run mutation testing
        run: npx stryker run ${FULL_RUN:+--force}
        env:
          FULL_RUN: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'true' || '' }}

      - name: Upload the shard's mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report-${{ matrix.shard }}
          path: web/reports/mutation
          retention-days: 30

  # One summary and one dashboard report for the whole run; the console logs are mostly expected per-mutant failures.
  mutation_report:
    needs: mutation_test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-web

      - name: Download the shard reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-report-*
          path: web/reports/shards

      - name: Merge the shard reports
        run: npm run mutation:merge -- reports/shards

      - name: Add mutation report to job summary
        if: always()
        run: npm run mutation:summary

      # Only a complete run on main, so the badge never shows a partial score.
      - name: Publish to the Stryker dashboard
        if: github.ref == 'refs/heads/main' && needs.mutation_test.result == 'success'
        env:
          STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
        run: |
          if [ -z "$STRYKER_DASHBOARD_API_KEY" ]; then echo "No STRYKER_DASHBOARD_API_KEY; not publishing."; exit 0; fi
          curl --fail-with-body --silent --show-error -X PUT \
            "https://dashboard.stryker-mutator.io/api/reports/github.com/${GITHUB_REPOSITORY}/main" \
            -H 'Content-Type: application/json' \
            -H "X-Api-Key: ${STRYKER_DASHBOARD_API_KEY}" \
            --data-binary @reports/mutation/mutation.json
